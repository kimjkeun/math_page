<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 자료</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap');

  :root {
    --ink: #1a2e2a;
    --paper: #f6f4ec;
    --panel: #fffdf7;
    --line: #d8d2c0;
    --grid: #e9e4d6;
    --teal: #2f7d6e;
    --teal-soft: #5aa395;
    --gold: #c08a2d;
    --gold-soft: #e4c074;
    --muted: #6f6a5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(192,138,45,.05), transparent 40%),
      var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- Header ---------- */
  header {
    padding: 54px 0 30px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 42px;
  }
  header h1 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 2.6rem;
    margin: 0;
    letter-spacing: -.01em;
  }
  header .lead {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 62ch;
  }

  /* ---------- Category ---------- */
  .category {
    margin-bottom: 40px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .category-header .icon {
    font-family: 'Spline Sans Mono', monospace;
    background: var(--teal);
    color: var(--panel);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: .85rem;
    font-weight: 500;
    flex: none;
  }
  .category-header h2 {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 1.45rem;
    margin: 0;
  }
  .category-empty {
    color: var(--muted);
    font-size: .9rem;
    padding: 20px 24px;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    text-align: center;
  }

  /* ---------- Lesson List ---------- */
  .lesson-list {
    display: grid;
    gap: 12px;
  }

  .lesson-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px 26px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .lesson-card:hover {
    border-color: var(--teal-soft);
    box-shadow: 0 4px 20px -8px rgba(47,125,110,.18);
    transform: translateY(-2px);
  }

  .lesson-card .num {
    font-family: 'Spline Sans Mono', monospace;
    background: var(--gold);
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: .95rem;
    font-weight: 500;
    flex: none;
  }

  .lesson-card .info { flex: 1; }

  .lesson-card .title {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 3px;
  }

  .lesson-card .desc {
    color: var(--muted);
    font-size: .85rem;
    margin: 0;
  }

  .lesson-card .arrow {
    font-size: 1.3rem;
    color: var(--teal-soft);
    flex: none;
    transition: transform .2s;
  }
  .lesson-card:hover .arrow {
    transform: translateX(4px);
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 70px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .85rem;
    text-align: center;
  }

  @media (max-width: 620px) {
    header h1 { font-size: 2rem; }
    .lesson-card { padding: 18px 20px; gap: 14px; }
    .lesson-card .title { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>수업 자료</h1>
    <p class="lead">각 주제를 클릭하면 인터랙티브 수업 자료를 확인할 수 있습니다.</p>
  </header>

  <div id="categories"></div>

  <footer>
    수업 자료 모음
  </footer>

</div>

<script>
(function() {
  const REPO = 'kimjkeun/math_page';
  const CATEGORIES = [
    { folder: '미적분', icon: 'I' },
    { folder: '수학과제탐구', icon: 'II' }
  ];

  const container = document.getElementById('categories');

  async function fetchFiles(folder) {
    const url = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(folder)}`;
    try {
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return data
        .filter(f => f.name.endsWith('.html') && !f.name.startsWith('_'))
        .map(f => f.name);
    } catch { return []; }
  }

  function createCard(folder, filename, index) {
    const title = filename.replace('.html', '');
    const num = String(index + 1).padStart(2, '0');
    return `
      <a class="lesson-card" href="${folder}/${filename}">
        <span class="num">${num}</span>
        <div class="info">
          <p class="title">${title}</p>
        </div>
        <span class="arrow">→</span>
      </a>`;
  }

  async function render() {
    for (const cat of CATEGORIES) {
      const files = await fetchFiles(cat.folder);
      const section = document.createElement('div');
      section.className = 'category';

      let html = `
        <div class="category-header">
          <span class="icon">${cat.icon}</span>
          <h2>${cat.folder}</h2>
        </div>`;

      if (files.length > 0) {
        html += '<div class="lesson-list">';
        files.forEach((f, i) => { html += createCard(cat.folder, f, i); });
        html += '</div>';
      } else {
        html += '<p class="category-empty">준비 중인 자료입니다.</p>';
      }

      section.innerHTML = html;
      container.appendChild(section);
    }
  }

  render();
})();
</script>
</body>
</html>
